# Netlify deploy config for the Expo web build.
#
# Local dev is unaffected: keep using `npm run web` (Expo dev server on :8081).
# To preview the production build locally: `npm run build:web && npx serve dist`.
#
# Set the EXPO_PUBLIC_FIREBASE_* variables (from .env.example) in the Netlify
# UI under Site settings → Environment variables so they're inlined at build.

[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Expo Router web is a single-page app: route every path to the SPA shell so
# deep links / refreshes don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
